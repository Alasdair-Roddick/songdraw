# fly.toml app configuration file generated for songdraw on 2026-09-02T20:15:23+09:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'songdraw'
primary_region = 'syd'

[build]

# Runs after the image builds, before any new Machine takes traffic. Until this
# existed, migrations had never run on Fly at all — every deploy shipped new
# code against whatever schema the database happened to have. A non-zero exit
# aborts the deploy, which is the point.
[deploy]
  release_command = 'node migrate.mjs'

[env]
  APP_URL = 'https://songdraw.fly.dev'

[processes]
  app = 'node server.js'
  cron = 'node fly-cron.mjs'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # There was no application-level health signal at all. `/` is the marketing
  # landing page and renders fine with a dead database, so Fly would have kept
  # routing to a Machine that couldn't serve a single round.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[vm]]
  processes = ['cron']
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[[restart]]
  processes = ['cron']
  policy = 'always'
