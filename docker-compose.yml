services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songdraw-app
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.songdraw-app.rule=Host(`song.roddickshare.space`)
      - traefik.http.routers.songdraw-app.entrypoints=web
      - traefik.http.services.songdraw-app.loadbalancer.server.port=3000

  # Applies committed Drizzle migrations before `app` starts. Unlike schema
  # push, this never infers or forces a destructive production change.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: songdraw-migrate
    env_file:
      - .env
    command: ["bunx", "drizzle-kit", "migrate"]
    networks:
      - internal
    restart: "no"

  cron:
    build:
      context: ./docker/cron
    container_name: songdraw-cron
    environment:
      APP_URL: http://app:3000
      CRON_TOKEN: ${CRON_TOKEN:?CRON_TOKEN must be set in .env}
    depends_on:
      - app
    networks:
      - internal
    restart: unless-stopped

  # Notification service — song-pool-dry / song-draw-failed / song-new-member
  # topics per GamePlan.md §3. Public so the ntfy mobile app can subscribe
  # over the internet, not just from containers on this host.
  ntfy:
    image: binwiederhier/ntfy
    container_name: songdraw-ntfy
    command: serve
    volumes:
      - ntfy_cache:/var/cache/ntfy
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.songdraw-ntfy.rule=Host(`ntfy.roddickshare.space`)
      - traefik.http.routers.songdraw-ntfy.entrypoints=web
      - traefik.http.services.songdraw-ntfy.loadbalancer.server.port=80

volumes:
  ntfy_cache:

networks:
  internal:
  proxy:
    external: true
