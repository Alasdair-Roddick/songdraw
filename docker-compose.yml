services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songdraw-app
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - proxy
    healthcheck:
      # Not `/` — that's the marketing landing page, which renders perfectly
      # with a dead database. /api/health actually touches Postgres.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.songdraw-app.rule=Host(`song.roddickshare.space`)
      - traefik.http.routers.songdraw-app.entrypoints=web
      - traefik.http.services.songdraw-app.loadbalancer.server.port=3000

  # Applies committed Drizzle migrations before `app` starts. Unlike schema
  # push, this never infers or forces a destructive production change.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: songdraw-migrate
    env_file:
      - .env
    command: ["bunx", "drizzle-kit", "migrate"]
    networks:
      - internal
    restart: "no"

  cron:
    build:
      context: ./docker/cron
    container_name: songdraw-cron
    environment:
      APP_URL: http://app:3000
      CRON_TOKEN: ${CRON_TOKEN:?CRON_TOKEN must be set in .env}
    depends_on:
      - app
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
  proxy:
    external: true
